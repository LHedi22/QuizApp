# Laptop prototype: app + worker (same image) + postgres. localhost only, no proxy,
# no TLS (REBUILD_SPEC §3, §6 Q8). Run from the repo root:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
name: quizscan

x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
  DEBUG: ${DEBUG:-0}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_URL: postgres://${POSTGRES_USER:-quizscan}:${POSTGRES_PASSWORD:-quizscan}@postgres:5432/${POSTGRES_DB:-quizscan}
  MEDIA_ROOT: /data/blob

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizscan}
      POSTGRES_DB: ${POSTGRES_DB:-quizscan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizscan} -d ${POSTGRES_DB:-quizscan}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["web"]
    environment: *app-env
    volumes:
      - blobstore:/data/blob
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["worker"]
    environment: *app-env
    volumes:
      - blobstore:/data/blob
    depends_on:
      postgres:
        condition: service_healthy
      # wait for `app` to finish `migrate` (it turns healthy only once it serves
      # /healthz) so the Django-Q2 tables exist before the cluster starts.
      app:
        condition: service_healthy

volumes:
  pgdata:
  blobstore:
