{% extends "base.html" %}
{% block title %}Delete {{ quiz.title }}{% endblock %}
{% block content %}
  <div class="mx-auto max-w-lg">
    <div class="card border-danger/30">
      <h1 class="mb-3">Delete quiz "{{ quiz.title }}"?</h1>
      <p class="mb-6 text-sm text-gray-600">
        This permanently removes the quiz and its {{ quiz.questions.count }} question(s).
        This cannot be undone.
      </p>
      <form method="post" action="{% url 'quiz_delete' quiz.pk %}" class="flex gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Delete permanently</button>
        <a href="{% url 'quiz_detail' quiz.pk %}" class="btn-ghost">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
