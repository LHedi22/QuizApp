{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}quizscanapp{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body>
  {% if user.is_authenticated %}
  <header class="nav">
    <a href="{% url 'dashboard' %}"><strong>quizscanapp</strong></a>
    <a href="{% url 'dashboard' %}">Quizzes</a>
    <span class="spacer"></span>
    <span class="muted">{{ user.email }}</span>
    <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button type="submit">Log out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
      <li class="{{ message.tags }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
